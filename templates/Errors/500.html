{% extends "base.html" %}

{% block title %}
Something Went Wrong · {{ p_full_name }}
{% endblock %}

{% block content %}
<section class="section" style="padding-top: 180px; text-align: center;">
  <div class="container">
    <span class="eyebrow">500</span>
    <h1 class="section-title">Something went wrong</h1>

      We're aware of the issue. Please try again in a moment, or head back home.

    <a href="{{ url_for('home.index') }}" class="btn btn-primary">Back to Home</a>
  </div>
</section>
{% endblock %}
